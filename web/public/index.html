<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>docker-bot chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #top { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  #model { flex: 1; padding: 0.4rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; min-height: 300px; padding: 1rem; margin-bottom: 1rem; white-space: pre-wrap; }
  .msg { margin: 0 0 1rem; }
  .role { font-weight: bold; }
  .user .role { color: #0b5cad; }
  .assistant .role { color: #1a7f37; }
  .error { color: #b00020; }
  .thought { color: #888; font-size: 0.85em; }
  .typing { color: #888; }
  #form { display: flex; gap: 0.5rem; }
  #input { flex: 1; padding: 0.5rem; }
</style>
</head>
<body>
<h1>docker-bot chat</h1>
<div id="top">
  <select id="model" aria-label="model"></select>
  <label title="Agent 模式：模型可呼叫檔案/shell 工具查真實資料；關掉就是純聊天"><input type="checkbox" id="agent" checked />Agent</label>
  <label title="關掉後回應快很多，但少了深度推理"><input type="checkbox" id="think" checked />深度思考</label>
  <button id="reload" type="button">重整模型</button>
  <button id="clear" type="button">清除對話</button>
</div>
<div id="log"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="輸入訊息…" />
  <button type="submit">送出</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), modelSel = $("model"), input = $("input");
let history = [];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<span class="role">${role === "user" ? "你" : "助理"}：</span><span class="text"></span>`;
  div.querySelector(".text").textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div.querySelector(".text");
}
function showError(text) {
  const div = document.createElement("div");
  div.className = "msg error";
  div.textContent = text;
  log.appendChild(div);
}

async function loadModels() {
  modelSel.innerHTML = "";
  try {
    const r = await fetch("/api/models");
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    for (const name of data.models) {
      const o = document.createElement("option");
      o.value = o.textContent = name;
      modelSel.appendChild(o);
    }
    if (!data.models.length) showError("Ollama 沒有可用模型");
  } catch (e) {
    showError("讀取模型失敗：" + e.message);
  }
}

$("reload").onclick = loadModels;
$("clear").onclick = () => { history = []; log.innerHTML = ""; };

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !modelSel.value) return;
  input.value = "";
  history.push({ role: "user", content: text });
  addMsg("user", text);
  if ($("agent").checked) {
    await runAgentTurn(text);
  } else {
    await runChatTurn();
  }
};

async function runAgentTurn() {
  const status = addMsg("assistant", "執行工具中…");
  status.classList.add("typing");
  try {
    const r = await fetch("/api/agent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        model: modelSel.value,
        messages: history,
        think: $("think").checked ? undefined : false,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || r.status);
    status.remove();
    if (data.steps && data.steps.length) {
      const det = document.createElement("details");
      det.className = "msg thought";
      const sum = document.createElement("summary");
      sum.textContent = `🔧 執行 ${data.steps.length} 個工具`;
      det.appendChild(sum);
      const pre = document.createElement("pre");
      pre.textContent = data.steps
        .map((s) => `› ${s.tool} ${JSON.stringify(s.args)}\n${String(s.detail).slice(0, 800)}`)
        .join("\n\n");
      det.appendChild(pre);
      log.appendChild(det);
    }
    const reply = data.result || "(Agent 沒有回報結果)";
    addMsg("assistant", reply);
    history.push({ role: "assistant", content: reply });
    log.scrollTop = log.scrollHeight;
  } catch (err) {
    status.remove();
    showError("Agent 失敗：" + err.message);
  }
}

async function runChatTurn() {
  const bubble = addMsg("assistant", "思考中…");
  bubble.classList.add("typing");
  const thought = document.createElement("div");
  thought.className = "msg thought";
  thought.style.display = "none";
  log.appendChild(thought);
  let reply = "", thinking = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        model: modelSel.value,
        messages: history,
        stream: true,
        think: $("think").checked ? undefined : false,
      }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || r.status);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const chunk = JSON.parse(line);
        if (chunk.message && chunk.message.thinking) {
          thinking += chunk.message.thinking;
          thought.style.display = "";
          thought.textContent = "💭 " + thinking.slice(-500);
          log.scrollTop = log.scrollHeight;
        }
        if (chunk.message && chunk.message.content) {
          if (bubble.classList.contains("typing")) {
            bubble.classList.remove("typing");
            bubble.textContent = "";
          }
          reply += chunk.message.content;
          bubble.textContent = reply;
          log.scrollTop = log.scrollHeight;
        }
        if (chunk.error) throw new Error(chunk.error);
      }
    }
    if (!reply) {
      bubble.classList.remove("typing");
      bubble.textContent = "(模型沒有輸出內容，請再試一次)";
    }
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    bubble.textContent = "";
    showError("呼叫失敗：" + err.message);
  }
};

loadModels();
</script>
</body>
</html>
